[catalog]
database_path = "../data/segments.sqlite3"

[cache]
local_cache_directory = "../data/cache"
local_cache_max_bytes = 5368709120

[storage]
type = "local_directory"
root_directory = "../data/segments"

[recording]
staging_directory = "../data/staging"
segment_duration_seconds = 10
delete_segments_without_motion = false

[[cameras]]
camera_name = "front_door"
rtsp_url = "env:FRONT_DOOR_RTSP_URL"

[embedding_backend]
type = "vllm"
model_name = "env:HOMESIGHT_MODEL_NAME"
embedding_dimension = "env:HOMESIGHT_EMBEDDING_DIMENSION"
base_url = "env:HOMESIGHT_MODEL_BASE_URL"
model_identifier = "qwen3-vl-embedding-8b:frames-2fps-448-v1"
query_request_builder = "vllm_multimodal"

[embedding_backend.input]
segment_input_mode = "frames"
transport = "data_url"
frames_per_second = 2
frame_width = 448
frame_height = 448

[vector_store]
host = "env:QDRANT_HOST"
http_port = "env:QDRANT_HTTP_PORT"
grpc_port = "env:QDRANT_GRPC_PORT"
collection_name = "env:QDRANT_COLLECTION"
distance_metric = "cosine"

[indexing]
interval_seconds = 600
maximum_retry_attempts = 3

[retention]
retention_days = 30
