name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
          python-version: "3.12"
      - name: Install native consumer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libopencv-dev libsqlite3-dev libcurl4-openssl-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - run: uv sync --locked --extra s3
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run --extra s3 pytest --cov=homesight_analytics --cov-report=term-missing
      - run: uv run pytest -m integration tests/test_integrations.py::test_native_video_frame_sampling
      - run: uv build
